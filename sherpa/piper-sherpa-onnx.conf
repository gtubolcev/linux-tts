# sd_piper-sherpa-onnx: Piper voices through sherpa-onnx (the module
# sd_sherpa-onnx under another name), loaded into the module when the first
# message comes or with PiperPreload. Defaults shown.

# voices: the sherpa-onnx form of Piper voices (vits-piper-<lang>-<name>-
# <quality>: the .onnx with its metadata, tokens.txt, espeak-ng-data) in
# subdirectories, also ~/.local/share/sherpa-onnx/tts, where the settings
# app installs downloaded ones
#PiperModelsDir "/usr/share/sherpa-onnx/tts"
PiperFamilies "piper"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it the first voice of the language.
#PiperVoice "ru" "piper-ru-dmitri-medium"
# load the voice when speech-dispatcher starts, not with the first message
# (about 0.3 s sooner; about 100 MB stay taken)
#PiperPreload 0
# free the voice after this many seconds without speech; 0 keeps it
#PiperIdleTimeout 300
# where the voices run: "cpu", or "vulkan" for the graphics card (the
# onnx-vulkan-rs plugin of onnxruntime). The synthesizer
# "piper-sherpa-onnx-vulkan-rs" is this module with "vulkan".
#PiperProvider "cpu"
# CPU threads, 0 = number of CPUs, at most 4
#PiperThreads 0
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#PiperFirstChunk 40
#Debug 0
