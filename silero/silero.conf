# sd_silero: Silero TTS (Russian) through silero-server. The server starts with
# the first message (about 4 s) and stops after SileroIdleTimeout seconds
# without speech (default 5 minutes). It survives speech-dispatcher reloads: the
# restarted module takes the running server over.
# The model and its runtime are licensed CC BY-NC-SA 4.0 (non-commercial use
# only) and are installed separately, with their licences, into SileroDir.
# The server talks to the module over a Unix socket in $XDG_RUNTIME_DIR, and it
# imports the runtime only if its files are those of silero-tts-onnx 0.5.0
# (sha256 in /usr/share/speech-dispatcher-silero/silero_onnx.sha256).
# Defaults shown.

#SileroServer "/usr/bin/silero-server"
# model version: v5_6_ru (speakers aidar, baya, eugene, kseniya, xenia)
#SileroVersion "v5_6_ru"
# runtime (silero_onnx/) and ONNX files (models/); empty = ~/.local/share/silero-tts/<version>
#SileroDir ""
# the voice of a language; clients that ask for a voice by name still get it.
# Without it, the voice type chooses: MALEn / FEMALEn is the n-th speaker of
# that gender.
#SileroVoice "ru" "silero-ru-xenia"
#SileroIdleTimeout 300
# speed at rate 100 (screen readers: 3-4); the model makes up to
# SileroModelMaxSpeed of it, the rest is sped up audio at the same pitch
#SileroMaxRate 4
#SileroModelMaxSpeed 1.3
# load the server as soon as speech-dispatcher starts, not with the first message
#SileroPreload 0
# CPU threads, 0 = number of CPUs, at most 4
#SileroThreads 0
#SileroLoadTimeout 60
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#SileroFirstChunk 0
#Debug 0

# Text normalization: numbers, dates, units and abbreviations of Russian
# text become words ("5 кг" -> "пять килограммов") before the voice reads
# them.  Needs the speech-dispatcher-text-normalizer package and the
# ru_normalizr Python package; without them the text is read as it is.
# One helper process serves all modules of the user; it starts with the
# first message and exits when no module has used it for
# TextNormalizationIdleTimeout seconds.
#TextNormalization yes
# milliseconds to wait for one answer, and for the helper to load
#TextNormalizationTimeout 1500
#TextNormalizationStartTimeout 8000
#TextNormalizationIdleTimeout 60

# Stress marks after the normalization, from the stress dictionaries (the
# first that knows a word wins; a capital letter inside a sentence takes
# the reading of a name, other homographs get the more frequent reading,
# context is not looked at yet).
#TextStress yes
#TextStressMark plus
#TextStressDictionary /usr/share/linux-tts/ru-stress/ru-stress.tsv:/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted

# A copy of everything the module speaks, for debugging: each message
# goes to DIR/outputN.wav and the text the voice got (after the
# normalizer) to DIR/outputN.txt, N counting up, while it plays as usual.
# An absolute path or ~/...; empty or commented out: no copy.
#AudioCopyDir ~/speech-copy
