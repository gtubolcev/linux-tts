# sd_sherpa-onnx: sherpa-onnx TTS models loaded into the module (about 1 s
# for Supertonic, when the first message comes or with SherpaPreload).
# Defaults shown.

# models: subdirectories, also ~/.local/share/sherpa-onnx/tts; Supertonic,
# Pocket TTS, Piper (sherpa-onnx vits-piper-*) and VITS models on characters
# (MMS) are recognised
#SherpaModelsDir "/usr/share/sherpa-onnx/tts"
# the model families listed; Piper voices are the synthesizer
# "piper-sherpa-onnx" (the same module)
SherpaFamilies "supertonic pocket vits"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender of the first model (Supertonic
# before MMS and Pocket).
#SherpaVoice "ru" "supertonic-ru-male-1"
# load a model (or the model of a voice) when speech-dispatcher starts, not
# with the first message: about 1 s sooner, but the memory (about 300 MB for
# Supertonic) stays taken even when another synthesizer is used
#SherpaPreload 0
# free the model after this many seconds without speech; the next message
# loads it again (a few seconds). 0 keeps it (the settings app sets 0 and
# Preload for the main synthesizer when "Load at login" is on)
#SherpaIdleTimeout 300
# where the models run: "cpu", or "vulkan" for the graphics card (the
# onnx-vulkan-rs plugin of onnxruntime; only Piper and MMS models, the
# others are left out). The synthesizer "sherpa-onnx-vulkan-rs" is this
# module with "vulkan".
#SherpaProvider "cpu"
# CPU threads, 0 = number of CPUs, at most 4
#SherpaThreads 0
# Supertonic denoising steps: 5; 8 sounds the same and is 1.6 times slower,
# 3 is audibly worse
#SherpaSupertonicSteps 5
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#SherpaFirstChunk 40
#Debug 0
