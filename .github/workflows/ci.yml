name: build and test
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mode: [full, minimal, sanitize]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci.sh ${{ matrix.mode }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.mode }}
          path: _ci/meson-logs/
