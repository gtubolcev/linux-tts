# sd_silero: Silero TTS (Russian) through silero-server. The server starts with
# the first message (about 4 s) and stops after SileroIdleTimeout seconds
# without speech (default one hour). It survives speech-dispatcher reloads: the
# restarted module takes the running server over.
# The model and its runtime are licensed CC BY-NC-SA 4.0 (non-commercial use
# only) and are installed separately, with their licences, into SileroDir.
# Defaults shown.

#SileroServer "/usr/bin/silero-server"
# model version: v5_6_ru (speakers aidar, baya, eugene, kseniya, xenia)
#SileroVersion "v5_6_ru"
# runtime (silero_onnx/) and ONNX files (models/); empty = ~/.local/share/silero-tts/<version>
#SileroDir ""
# the voice of a language; clients that ask for a voice by name still get it.
# Without it, the voice type chooses: MALEn / FEMALEn is the n-th speaker of
# that gender.
#SileroVoice "ru" "silero-ru-xenia"
#SileroIdleTimeout 3600
# load the server as soon as speech-dispatcher starts, not with the first message
#SileroPreload 0
# CPU threads, 0 = number of CPUs, at most 4
#SileroThreads 0
#SileroLoadTimeout 60
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#SileroFirstChunk 0
#Debug 0
