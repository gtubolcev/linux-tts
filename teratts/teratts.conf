# sd_teratts: TeraTTSv2 voices (TeraSpace; Russian and English), loaded into
# the module in the background when speech-dispatcher starts (TerattsPreload)
# or with the first message.
# Defaults shown.

# the model release: models/, styles/, unicode_indexer.json;
# also ~/.local/share/teratts/teratts-v2
#TerattsModelDir "/usr/share/teratts/teratts-v2"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender. Every voice reads both
# languages; Latin words in Russian text are read as English.
#TerattsVoice "ru" "teratts-ru-f1"
# the stress dictionary (word<TAB>phonemes, sorted), the one of Vosk TTS;
# "+" before a vowel in the text sets the stress by hand
#TerattsDictionary "/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted"
# load the model when speech-dispatcher starts, not with the first message;
# the memory stays taken even when another synthesizer is used
#TerattsPreload 1
# free the model after this many seconds without speech; the next message
# loads it again (a few seconds). 0 keeps it
#TerattsIdleTimeout 0
# CPU threads, 0 = number of CPUs, at most 4
#TerattsThreads 0
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#TerattsFirstChunk 40
#Debug 0
