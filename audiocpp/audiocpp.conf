# sd_audiocpp: the TTS models of audio.cpp (ggml), loaded into the module
# with the first message, or in the background when speech-dispatcher starts
# (AudiocppPreload).
# Defaults shown.

# models: subdirectories with an audiocpp.ini (see sd_audiocpp.c), also
# ~/.local/share/audiocpp-tts
#AudiocppModelsDir "/usr/share/audiocpp-tts"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender.
#AudiocppVoice "ru" "pocket-ru-sup1"
# load the model when speech-dispatcher starts, not with the first message;
# the memory stays taken even when another synthesizer is used
#AudiocppPreload 0
# free the model after this many seconds without speech; the next message
# loads it again (a few seconds). 0 keeps it (the settings app sets 0 and
# Preload for the main synthesizer when "Load at login" is on)
#AudiocppIdleTimeout 300
# speed at rate 100 (screen readers: 3-4); a model with a speed parameter
# makes up to AudiocppModelMaxSpeed of it, the rest is sped up audio at the
# same pitch (models without one, as Pocket TTS: all of it)
#AudiocppMaxRate 4
#AudiocppModelMaxSpeed 1.3
# where the models run: "cpu", "vulkan" (the graphics card; the synthesizer
# audiocpp-vulkan-rs sets it in its own file), or another ggml back end of
# the library ("cuda", "best")
#AudiocppBackend "cpu"
# the device of the back end, 0 = the first graphics card
#AudiocppDevice 0
# CPU threads, 0 = number of CPUs, at most 4
#AudiocppThreads 0
# Kokoro models (phonemizer=kokoro in audiocpp.ini) get their phonemes from
# the front end of sd_kokoro: its espeak-ng data and misaki dictionaries
# (package speech-dispatcher-kokoro), and the Russian stress dictionaries,
# separated by ":"; without the data the Kokoro voices are left out
#AudiocppKokoroData "/usr/share/speech-dispatcher-kokoro"
#AudiocppDictionary "/usr/share/linux-tts/ru-stress/ru-stress.tsv:/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted"
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#AudiocppFirstChunk 40
#Debug 0

# Text normalization: numbers, dates, units and abbreviations of Russian
# text become words ("5 кг" -> "пять килограммов") before the voice reads
# them.  Needs the speech-dispatcher-text-normalizer package and the
# ru_normalizr Python package; without them the text is read as it is.
# One helper process serves all modules of the user; it starts with the
# first message and exits when no module has used it for
# TextNormalizationIdleTimeout seconds.
#TextNormalization yes
# milliseconds to wait for one answer, and for the helper to load
#TextNormalizationTimeout 1500
#TextNormalizationStartTimeout 8000
#TextNormalizationIdleTimeout 60

# The stress dictionaries after the normalization, for the models that read
# stress marks (stress= in audiocpp.ini, as tiny-voca-ru): "+" before the
# stressed vowel or U+0301 after it, and ё where the dictionary has it
# (a capital letter inside a sentence takes the reading of a name, other
# homographs get the more frequent reading). The other models get the text
# without marks.  TextStressMark acute|plus|none sets the mark for every
# such model; none leaves only ё.
#TextStress yes
#TextStressMark
#TextStressDictionary /usr/share/linux-tts/ru-stress/ru-stress.tsv:/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted

# Homographs from the context (за́мок / замо́к, все / всё): rules alone, or
# with a RUAccent model, small (tiny, ~55 MB, ~1 ms a sentence) or large
# (turbo, ~380 MB, ~10 ms) from the packages ruaccent-model-tiny/-turbo in
# /usr/share/linux-tts/ruaccent; a model of one's own in
# ~/.local/share/linux-tts/ruaccent/<size> (or TextStressHomographsDir) is
# used instead.  Without a model "tiny"/"turbo" work as "rules".  The model is freed after
# TextStressHomographsIdle seconds without speech.
#TextStressHomographs none
#TextStressHomographsDir
#TextStressHomographsIdle 300

# A copy of everything the module speaks, for debugging: each message
# goes to DIR/outputN.wav and the text the voice got (after the
# normalizer) to DIR/outputN.txt, N counting up, while it plays as usual.
# An absolute path or ~/...; empty or commented out: no copy.
#AudioCopyDir ~/speech-copy
