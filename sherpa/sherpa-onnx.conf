# sd_sherpa-onnx: sherpa-onnx TTS models loaded into the module (about 1 s
# for Supertonic, 0.3 s for a Piper voice, when the first message comes or
# with SherpaPreload). Defaults shown.

# models: subdirectories, also ~/.local/share/sherpa-onnx/tts, where the
# settings app installs downloaded ones; Supertonic, Pocket TTS, Piper (the
# sherpa-onnx form vits-piper-*: .onnx with its metadata, tokens.txt,
# espeak-ng-data) and VITS models on characters (MMS) are recognised
#SherpaModelsDir "/usr/share/sherpa-onnx/tts"
# the model families listed
SherpaFamilies "supertonic piper pocket vits"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender of the first model (Supertonic,
# then Piper, MMS, Pocket).
#SherpaVoice "ru" "supertonic-ru-male-1"
# load a model (or the model of a voice) when speech-dispatcher starts, not
# with the first message: about 1 s sooner, but the memory (about 300 MB for
# Supertonic) stays taken even when another synthesizer is used
#SherpaPreload 0
# free the model after this many seconds without speech; the next message
# loads it again (a few seconds). 0 keeps it (the settings app sets 0 and
# Preload for the main synthesizer when "Load at login" is on)
#SherpaIdleTimeout 300
# how many models stay loaded at once (1-4): with voices of two models, say
# Piper for Russian and Supertonic for English, a text in both languages
# does not load a model at every change of language. When a further one is
# needed, the one used longest ago is freed.
#SherpaMaxModels 2
# where the models run: "cpu", or "vulkan" for the graphics card (the
# onnx-vulkan-rs plugin of onnxruntime; Piper, MMS and Supertonic models,
# Pocket is left out). The synthesizer "sherpa-onnx-vulkan-rs" is this
# module with "vulkan".
#SherpaProvider "cpu"
# CPU threads, 0 = number of CPUs, at most 4
#SherpaThreads 0
# Supertonic denoising steps: 5; 8 sounds the same and is 1.6 times slower,
# 3 is audibly worse
#SherpaSupertonicSteps 5
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#SherpaFirstChunk 40
# the pauses the voice makes (between sentences, at commas), as a share of
# those it was trained with; below 1 shorter
#SherpaSilenceScale 1.0
#Debug 0

# Text normalization: numbers, dates, units and abbreviations of Russian
# text become words ("5 кг" -> "пять килограммов") before the voice reads
# them.  Needs the speech-dispatcher-text-normalizer package and the
# ru_normalizr Python package; without them the text is read as it is.
# The helper process starts with the first message and stops with the
# model after the idle timeout.
#TextNormalization yes
# milliseconds to wait for one answer, and for the helper to load
#TextNormalizationTimeout 1500
#TextNormalizationStartTimeout 8000

# The stress dictionaries after the normalization: put ё where the
# dictionary has it (ещё, ёжик; a capital letter inside a sentence takes
# the reading of a name, other homographs get the more frequent reading).
# Russian Piper voices also get the stress mark U+0301 when their espeak-ng
# data honours it (piper-espeak-ng-data >= 1.1; the original data moves the
# stress to another syllable on a mark); other voices read letters and get
# only ё.  TextStressMark acute|plus|none sets the mark for every voice.
#TextStress yes
#TextStressMark
#TextStressDictionary /usr/share/linux-tts/ru-stress/ru-stress.tsv:/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted

# A copy of everything the module speaks, for debugging: each message
# goes to DIR/outputN.wav and the text the voice got (after the
# normalizer) to DIR/outputN.txt, N counting up, while it plays as usual.
# An absolute path or ~/...; empty or commented out: no copy.
#AudioCopyDir ~/speech-copy
